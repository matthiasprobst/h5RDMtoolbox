name: Tests

env:
  H5RDMTOOLBOX_CACHE_DIR: .cache/zenodo
  H5RDMTOOLBOX_RUN_ZENODO_UPLOAD_TESTS: '0'
  H5RDMTOOLBOX_RUN_WIKIDATA_TESTS: '0'

permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop/*
      - develop-*
      - dev-*
      - dev/*
      - feature/*
      - release/*
      - hotfix/*
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        # Python 3.9 is unsupported and unavailable on Ubuntu 26.04.
        python-version: [ '3.10', '3.11', '3.12', '3.13' ]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set Up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools>=78.1.1"
          python -m pip install -e ".[test]"

      - name: Cache Zenodo downloads
        uses: actions/cache@v5
        with:
          path: .cache/zenodo
          key: zenodo-${{ runner.os }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            zenodo-${{ runner.os }}-

      - name: Run pytest coverage
        run: python -m pytest --cov=h5rdmtoolbox --cov-report=xml

      - name: Upload coverage to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml

      - uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
