# github action including pymongo see https://github.com/marketplace/actions/mongodb-in-github-actions

name: Tests

env:
  H5RDMTOOLBOX_CACHE_DIR: .cache/zenodo
  H5RDMTOOLBOX_RUN_ZENODO_UPLOAD_TESTS: '0'
  H5RDMTOOLBOX_RUN_WIKIDATA_TESTS: '0'

permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop/*
      - develop-*
      - dev-*
      - dev/*
      - feature/*
      - release/*
      - hotfix/*
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install server test dependencies
        run: python -m pip install -e ".[test-server]"
      - name: Run required server tests
        env:
          H5RDMTOOLBOX_REQUIRE_SERVER_TESTS: '1'
        run: python -m pytest tests/test_server.py -q --junitxml=server-test-results.xml
      - name: Verify server tests executed without skips
        run: python -m tests.check_test_report server-test-results.xml
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        # Python 3.9 is unsupported and unavailable on Ubuntu 26.04.
        python-version: [ '3.10', '3.11', '3.12', '3.13' ]
        mongodb-version: ['5.0', ]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set Up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pandoc for ubuntu
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get install -y pandoc

      - name: Install choco for windows
        if: startsWith(matrix.os, 'windows-')
        run: choco install pandoc -y

      - name: Install pandoc for macOS
        if: startsWith(matrix.os, 'macos-')
        run: brew install pandoc

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools>=78.1.1"
          python -m pip install -e ".[test]"

#      - name: Install MongoDB (Windows)  # see: https://github.com/ankane/setup-mongodb
#        if: startsWith(matrix.os, 'windows-')
#        uses: ankane/setup-mongodb@v1
#        with:
#          mongodb-version: 5.0
      - name: Start MongoDB (Linux)
        if: startsWith(matrix.os, 'ubuntu-')
        uses: supercharge/mongodb-github-action@1.3.0
        with:
          mongodb-version: ${{ matrix.mongodb-version }}

      - name: Cache Zenodo downloads
        uses: actions/cache@v5
        with:
          path: .cache/zenodo
          key: zenodo-${{ runner.os }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            zenodo-${{ runner.os }}-

      - name: Run pytest coverage
        run: python -m pytest --cov=h5rdmtoolbox --cov-report=xml

      - name: Upload coverage to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml

      - uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
